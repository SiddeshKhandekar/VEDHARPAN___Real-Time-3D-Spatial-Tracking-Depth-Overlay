<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEDHARPAN 3D Viewport</title>
    <link rel="stylesheet" href="style.css">

    <!-- ES Module Import Map for Three.js and loaders -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>

<body>
    <!-- Main WebGL rendering canvas -->
    <canvas id="viewport"></canvas>

    <!-- Overlay HUD for server status and diagnostics -->
    <div id="hud">
        <div class="hud-item">Status: <span id="status" class="disconnected">Disconnected</span></div>
        <div class="hud-item">FPS: <span id="fps">0</span></div>
        <div class="hud-item">Head: <span id="head-coords">x: 0.00, y: 0.00, z: 0.00</span></div>
        <div class="hud-item">Hands: <span id="hands-coords">0 detected</span></div>
        <div class="hud-item">Camera: <span id="camera-mode">Free Roam</span></div>
        <button id="disconnect-btn" class="hud-item disconnect-btn">Disconnect & Close</button>
    </div>

    <!-- Game HUD -->
    <div id="game-hud">
        <div class="game-hud-item">❤️ <span id="health">100</span></div>
        <div class="game-hud-item">🏆 <span id="score">0</span></div>
        <div class="game-hud-item" id="fire-mode-hud"><span id="fire-mode-name">PLASMA</span></div>
    </div>

    <!-- Crosshair -->
    <div id="crosshair"></div>

    <!-- Main Menu -->
    <div id="main-menu" class="main-menu hidden">
        <h1 class="game-title">VEDHARPAN</h1>
        <div class="menu-buttons">
            <button id="btn-start" class="menu-btn">Start Game</button>
            <button id="btn-options" class="menu-btn">Options</button>
            <button id="btn-quit" class="menu-btn">Quit</button>
        </div>
    </div>



    <!-- Ammo Meters Panel (bottom-right) -->
    <div id="ammo-meters">
        <div class="ammo-meter" id="meter-1" data-mode="1">
            <span class="meter-label">PLASMA <span class="meter-count">15/15</span></span>
            <div class="meter-track">
                <div class="meter-fill" style="width:100%"></div>
            </div>
        </div>
        <div class="ammo-meter" id="meter-2" data-mode="2">
            <span class="meter-label">RAPID <span class="meter-count">200/200</span></span>
            <div class="meter-track">
                <div class="meter-fill" style="width:100%"></div>
            </div>
        </div>
        <div class="ammo-meter" id="meter-3" data-mode="3">
            <span class="meter-label">MISSILE <span class="meter-count">10/10</span></span>
            <div class="meter-track">
                <div class="meter-fill" style="width:100%"></div>
            </div>
        </div>
        <div class="ammo-meter" id="meter-4" data-mode="4">
            <span class="meter-label">GRENADE <span class="meter-count">2/2</span></span>
            <div class="meter-track">
                <div class="meter-fill" style="width:100%"></div>
            </div>
        </div>
    </div>

    <!-- Main Scene script -->
    <script type="module" src="scene.js"></script>
</body>

</html>
